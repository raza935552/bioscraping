# BiolinX Affiliate Engine — nginx site for gemboxpk.com (live since 2026-09-14).
# Installed as /etc/nginx/conf.d/biolinx.conf; salonapp.conf was disabled
# because both claim gemboxpk.com. After editing this file:
#   cp infra/nginx-gemboxpk.conf /etc/nginx/conf.d/biolinx.conf
#   nginx -t && systemctl reload nginx

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gemboxpk.com www.gemboxpk.com;

    ssl_certificate     /etc/letsencrypt/live/gemboxpk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gemboxpk.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Admin panel holds lead PII — keep it out of search engines and frames.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 20M;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }

    access_log /var/log/nginx/biolinx.access.log main;
    error_log  /var/log/nginx/biolinx.error.log warn;
}

server {
    listen 80;
    listen [::]:80;
    server_name gemboxpk.com www.gemboxpk.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
